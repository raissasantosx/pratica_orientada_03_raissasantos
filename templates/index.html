{% extends 'base.html' %}

{% block title %}
    Início
{% endblock %}

<!-- Passar usuario (pode ser None) -->

{% block content %}
    <header>
        <h1>Início</h1>
        {% if usuario %}
            <a href="{{ url_for('new_book')}}">Cadatrar Livro</a>
            <a href="{{ url_for('livros') }}">Livros</a>
            <a href="{{ url_for('logout') }}">Sair</a>
        {% else %}
            <a href="{{ url_for('login') }}">Entrar</a>
            <a href="{{ url_for('new_user')}}">Cadastro</a>
        {% endif %}
    </header>
{% endblock %}
